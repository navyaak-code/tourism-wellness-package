name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  validate-application:
    name: Validate Streamlit Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required deployment files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f Dockerfile
          echo "All required deployment files are present."

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          echo "app.py syntax validation successful."

      - name: Display pipeline completion
        run: |
          echo "Tourism Wellness Package MLOps validation completed successfully."
